[project]
name = "frontier-global-lab"
version = "0.5.0"
description = "Local knowledge base + agent harness for Frontier Global Lab"
requires-python = ">=3.11"
dependencies = [
  "openai-agents",
  "tavily-python",
  "python-dotenv",
  "PyYAML"
]

[project.scripts]
lab = "harness.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
